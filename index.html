<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Нейробюро онлайн — интерактивный когнитивный тест</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>
<script>
(async () => {
  const parts = [
    'app.part01.txt','app.part02.txt','app.part03.txt','app.part04.txt',
    'app.part05.txt','app.part06.txt','app.part07.txt'
  ];
  try {
    const source = (await Promise.all(parts.map(async path => {
      const response = await fetch(path, { cache: 'no-store' });
      if (!response.ok) throw new Error(`${path}: HTTP ${response.status}`);
      return response.text();
    }))).join('');
    (0, eval)(source);
  } catch (error) {
    document.getElementById('app').innerHTML =
      '<main style="max-width:760px;margin:48px auto;padding:24px;font-family:system-ui">' +
      '<h1>Не удалось загрузить тест</h1><p>' +
      String(error).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) +
      '</p></main>';
  }
})();
</script>
</body>
</html>
